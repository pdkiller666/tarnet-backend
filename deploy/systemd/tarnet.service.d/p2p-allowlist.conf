[Service]
# Путь к списку пиров, которым мост разрешает открывать поток задач.
#
# Явный абсолютный путь, а не вывод из P2P_DATA_DIR: у сервера и моста разные
# рабочие каталоги и разные наборы env, поэтому «по умолчанию одинаково»
# здесь не выполняется. Если бы сервер писал в p2p-node/data, а мост читал
# /var/lib/tarnet/p2p, отказ выглядел бы как «ключ не сошёлся» — самая
# дорогая в отладке ошибка, потому что обе стороны работают правильно.
#
# Права: каталог 0700 root, файл 0600 root. Публичные ключи секретом не
# являются (они и так в базе), но список целиком не должен быть читаем
# посторонним: он показывает, какие воркеры привязаны к узлу.
Environment=P2P_ALLOWLIST=/var/lib/tarnet/p2p/authorized-peers.json
