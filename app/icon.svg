<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="TarNet">
  <!-- Канонический логотип TarNet. Один и тот же путь используется в шапках
       лендинга (/), PWA (/app/) и консоли (/ui/console.html), а также лежит
       в основе icon-192/512/180 и favicon-32 (scripts/make-icons.js рисует
       эту же геометрию). Два цвета — не украшение: бирюза = бренд/CTA,
       синий = функциональность. Поэтому градиент идёт ровно между ними. -->
  <defs>
    <linearGradient id="tnGrad" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5fe0d3"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>
  <rect x="1.5" y="1.5" width="29" height="29" rx="9" fill="url(#tnGrad)"/>
  <path d="M16 12.8v-2.6M18.7 17.5l2.3 1.4M13.3 17.5l-2.3 1.4" stroke="#062522" stroke-width="1.7" stroke-linecap="round" fill="none"/>
  <circle cx="16" cy="16" r="3.1" fill="#062522"/>
  <circle cx="16" cy="8.4" r="2.1" fill="#062522"/>
  <circle cx="22.8" cy="19.9" r="2.1" fill="#062522"/>
  <circle cx="9.2" cy="19.9" r="2.1" fill="#062522"/>
</svg>
